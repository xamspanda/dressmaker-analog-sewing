<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Nunito:wght@500;700;800&amp;display=block');
.title { font-family: Fraunces, Georgia, serif; font-weight: 700; fill: #f6eee3; }
.sub { font-family: Nunito, 'Noto Sans', sans-serif; font-weight: 700; fill: #c9bccf; }
.body { font-family: Nunito, 'Noto Sans', sans-serif; font-weight: 700; fill: #f6eee3; }
.mono { font-family: 'iA Writer Mono S', 'Liberation Mono', monospace; fill: #f6eee3; }
</style>
<defs>
  <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#2a2135"/>
    <path d="M0 7h14M7 0v14" stroke="#352a44" stroke-width="1.2"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1920" height="1080" fill="url(#weave)"/>

  <text x="960" y="160" text-anchor="middle" class="title" style="font-size:80px">Install in 3 steps</text>
  <text x="960" y="228" text-anchor="middle" class="sub" style="font-size:32px">Works on Windows and on Linux / Steam Deck through Proton</text>
  
  <rect x="150" y="300" width="500" height="520" rx="28" fill="#3d3150" opacity="0.92"/>
  <circle cx="260" cy="420" r="62" fill="#e8798c"/>
  <text x="260" y="446" text-anchor="middle" class="title" style="font-size:72px;fill:#2a2135">1</text>
  <text x="200" y="555" class="title" style="font-size:46px">Install BepInEx 5</text>
  <text x="200" y="620" class="sub" style="font-size:31px;fill:#f6eee3">Extract BepInEx 5 (x64) into</text><text x="200" y="670" class="sub" style="font-size:31px;fill:#f6eee3">the Dressmaker folder, next</text><text x="200" y="720" class="sub" style="font-size:31px;fill:#f6eee3">to Dressmaker.exe</text>
  <rect x="710" y="300" width="500" height="520" rx="28" fill="#3d3150" opacity="0.92"/>
  <circle cx="820" cy="420" r="62" fill="#f0bf5a"/>
  <text x="820" y="446" text-anchor="middle" class="title" style="font-size:72px;fill:#2a2135">2</text>
  <text x="760" y="555" class="title" style="font-size:46px">Add Analog Sewing</text>
  <text x="760" y="620" class="sub" style="font-size:31px;fill:#f6eee3">Extract this mod into the</text><text x="760" y="670" class="sub" style="font-size:31px;fill:#f6eee3">same folder. Wooting's</text><text x="760" y="720" class="sub" style="font-size:31px;fill:#f6eee3">Analog SDK is included.</text>
  <rect x="1270" y="300" width="500" height="520" rx="28" fill="#3d3150" opacity="0.92"/>
  <circle cx="1380" cy="420" r="62" fill="#6cc4b8"/>
  <text x="1380" y="446" text-anchor="middle" class="title" style="font-size:72px;fill:#2a2135">3</text>
  <text x="1320" y="555" class="title" style="font-size:46px">Sew!</text>
  <text x="1320" y="620" class="sub" style="font-size:31px;fill:#f6eee3">Launch the game and press</text><text x="1320" y="670" class="sub" style="font-size:31px;fill:#f6eee3">Space gently, then harder.</text><text x="1320" y="720" class="sub" style="font-size:31px;fill:#f6eee3">No other setup needed.</text>
  <rect x="380" y="880" width="1160" height="110" rx="22" fill="#2a2135" stroke="#352a44" stroke-width="2"/>
  <text x="960" y="924" text-anchor="middle" class="sub" style="font-size:26px">Linux / Steam Deck launch options:</text>
  <text x="960" y="968" text-anchor="middle" class="mono" style="font-size:30px;fill:#f0bf5a">WINEDLLOVERRIDES="winhttp=n,b" %command%</text>

</svg>